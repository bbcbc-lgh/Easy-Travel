name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # A real venv, because pyproject.toml points pyright at backend/.venv: the
      # type check has to see the same installed packages the tests do.
      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements-dev.txt

      # Pinned versions rot: fastapi 0.116.1 once pinned starlette < 0.48, where
      # no patched release existed. This step is what makes that visible.
      - name: Dependency audit
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/python -m pip_audit -r requirements.txt

      - name: Lint
        run: .venv/bin/ruff check src tests evals

      - name: Type check
        run: .venv/bin/python -m pyright

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Offline itinerary eval baseline
        run: .venv/bin/python -m evals --mode sample

  frontend:
    name: frontend lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
