name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        # The declared support range is "3.11+", so check both ends of it rather
        # than a single version that happens to be the default.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # A real venv, because pyproject.toml points pyright at backend/.venv: the
      # type check has to see the same installed packages the tests do.
      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements-dev.txt

      # Pinned versions rot: fastapi 0.116.1 once pinned starlette < 0.48, where
      # no patched release existed. This step is what makes that visible.
      - name: Dependency audit
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/python -m pip_audit -r requirements.txt

      - name: Dependency consistency
        run: .venv/bin/python -m pip check

      - name: Lint
        run: .venv/bin/ruff check src tests evals

      - name: Format check
        run: .venv/bin/ruff format --check src tests evals

      - name: Type check
        run: .venv/bin/python -m pyright

      # Coverage is configured in pyproject.toml and printed by every run; it is
      # not a gate yet.
      - name: Run tests
        run: .venv/bin/python -m pytest -q

      # Two floors, two different questions: how good the itineraries are, and
      # whether a traveller could follow them as written. Offline the second one is
      # 100% by construction (the rule planner is deterministic geometry), so it
      # guards against structural regressions - the meaningful run is --mode live.
      - name: Offline itinerary eval baseline
        run: >
          .venv/bin/python -m evals --mode sample
          --min-score 70 --max-errors 0 --min-usable-ratio 1.0

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --no-audit here only because the audit gets its own explicit step below.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Two gates on purpose: what ships must be clean of *any* advisory, and the
      # build-time toolchain must stay free of moderate ones too. minimatch (one
      # advisory, inherited by eslint and typescript-eslint) is held at >=11 by an
      # override in package.json; npm's own suggestion is a downgrade, not a fix.
      - name: Dependency audit (shipped code)
        run: npm audit --omit=dev

      - name: Dependency audit (toolchain)
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Stylelint
        run: npm run lint:style

      - name: Unit tests
        run: npm run test:coverage

      - name: Typecheck and build
        run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # The suite drives the real backend in sample mode, so it needs Python too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # No --with-deps: that runs apt against the Ubuntu mirrors, which is the one
      # thing here that can fail for reasons unrelated to this repository (a DNS
      # blip turned into a red build). The runner image already carries the
      # libraries Chromium needs.
      - name: Install browser
        run: npx playwright install chromium

      - name: Run e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
