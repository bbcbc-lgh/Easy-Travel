# Runs the same checks as CI, but before the commit instead of a minute after the
# push. CI stays the authority; this is only about feedback speed.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # .gitattributes already normalises these; this catches edits made before a
      # checkout re-applies it.
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/package-lock\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      # `language: python` gives pyright its own isolated environment, so the hook
      # does not depend on which interpreter happens to be on PATH - the previous
      # version hard-coded backend/.venv/Scripts/python, which only exists on
      # Windows. `--project backend` makes it read backend/pyproject.toml, whose
      # venvPath then points at backend/.venv for package resolution.
      - id: pyright
        name: pyright (backend)
        entry: pyright --project backend
        language: python
        additional_dependencies: ["pyright==1.1.414"]
        files: ^backend/.*\.py$
        pass_filenames: false

      # `npm --prefix frontend run ...` sets the working directory for the script,
      # so ESLint finds frontend/eslint.config.js and Prettier finds its config.
      - id: frontend-lint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|vue|js)$
        pass_filenames: false

      - id: frontend-format
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/.*\.(ts|vue|js|json|css|html)$
        pass_filenames: false
