# Runs the same checks as CI, but before the commit instead of a minute after the
# push. CI stays as the authority; this is only about feedback speed.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # .gitattributes already normalises these; this catches edits made before a
      # checkout re-applies it.
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/package-lock\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      # Local hooks, because these three need the project's own environments:
      # pyright resolves packages from backend/.venv, and eslint/prettier run
      # through the frontend's node_modules.
      - id: pyright
        name: pyright (backend)
        entry: backend/.venv/Scripts/python -m pyright
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: frontend-lint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|vue|js)$
        pass_filenames: false

      - id: frontend-format
        name: prettier (frontend)
        entry: npx --prefix frontend prettier --check
        language: system
        files: ^frontend/.*\.(ts|vue|js|json|css)$
        pass_filenames: true
