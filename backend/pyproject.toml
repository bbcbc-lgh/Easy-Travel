[tool.ruff]
line-length = 120
# 3.11, not 3.10: the code uses datetime.UTC and asyncio.timeout.
target-version = "py311"
extend-exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
# "S" is flake8-bandit: it catches hard-coded secrets and unsafe calls.
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "E501",
    # Subprocess/shell usage is not present in this project, but these two fire on
    # test helpers and on the retry jitter; keep the set focused on real risks.
    "S311",
]

[tool.ruff.lint.per-file-ignores]
# assert is the testing API.
"tests/*" = ["B011", "S101"]
# FastAPI declares dependencies as default arguments by design.
"src/api/*" = ["B008"]

[tool.pyright]
# Application code only. Tests drive their own fakes (e.g. a stand-in LLM client)
# whose shapes intentionally differ from the SDK's TypedDicts, so type-checking
# them would produce noise rather than findings.
include = ["src", "evals"]
exclude = ["**/__pycache__", ".venv", "data", ".pytest_cache", ".ruff_cache"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Third-party packages without stubs are not this project's problem.
reportMissingTypeStubs = false
# Resolve installed packages from the project venv (backend/.venv), both locally
# and in CI, which creates the same path before type-checking.
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# Coverage is measured on every run so a regression is visible immediately. It is
# deliberately not a gate: a percentage says where to look, not whether the code
# is right.
addopts = "--cov=src --cov=evals --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src", "evals"]
branch = true

[tool.coverage.report]
# Keep the summary readable; the detail is one --cov-report=html away.
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]