[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI declares dependencies as default arguments by design.
"src/api/*" = ["B008"]
